name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le zip
        run: unzip -oq xwx.zip -d projet

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        working-directory: projet
        run: npm install --legacy-peer-deps

      - name: Build web
        working-directory: projet
        run: npm run build

      - name: Ajouter Capacitor
        working-directory: projet
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "VTC Connect" com.somed.vtcconnect --web-dir=dist
          npx cap add android

      - name: Permission géolocalisation
        working-directory: projet
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser
        working-directory: projet
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: projet/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: projet/android/app/build/outputs/apk/debug/app-debug.apk
